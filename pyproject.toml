[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-drive"
version = "0.1.0"
description = "Jev structured decisions for autonomous-driving research"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
vision = ["torch>=2.5", "transformers>=5,<6", "accelerate>=1", "Pillow>=10"]

[project.scripts]
jev-drive = "jev_drive.__main__:main"

[tool.setuptools.packages.find]
include = ["jev_drive*"]
